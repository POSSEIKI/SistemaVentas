version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: sistemaventas_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-sistemaventas.cloud}
      - ACME_EMAIL=${ACME_EMAIL:-admin@sistemaventas.cloud}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: sistemaventas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_segura}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_ventas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistemaventas_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_segura}@postgres:5432/${POSTGRES_DB:-sistema_ventas}
      - SECRET_KEY=${SECRET_KEY:-clave_secreta_super_segura_produccion_2026}
      - ALLOWED_ORIGINS=*
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistemaventas_frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

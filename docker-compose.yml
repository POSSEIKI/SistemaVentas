version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sistemaventas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_segura}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_ventas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistemaventas_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_segura}@postgres:5432/${POSTGRES_DB:-sistema_ventas}
      - SECRET_KEY=${SECRET_KEY:-clave_secreta_super_segura_produccion_2026}
      - ALLOWED_ORIGINS=*
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Frontend React SPA + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistemaventas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
